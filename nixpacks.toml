# Nixpacks configuration for Railway deployments
# Note: Each service should set its own start command in Railway dashboard
# API: node apps/api/dist/index.js
# Worker: node apps/worker/dist/index.js

[phases.setup]
nixPkgs = ["nodejs_20", "pnpm", "openssl"]

[phases.install]
cmds = ["pnpm install"]

[phases.build]
cmds = ["pnpm --filter @myautowhiz/shared run build", "npx prisma@5.22.0 generate --schema=apps/api/prisma/schema.prisma", "pnpm --filter @myautowhiz/api run build", "pnpm --filter @myautowhiz/worker run build"]

# Default start command - override in Railway dashboard per service
# Or use START_COMMAND env var
[start]
cmd = "sh -c 'node ${START_COMMAND:-apps/api/dist/index.js}'"
